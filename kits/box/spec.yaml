schemaVersion: "2"
kind: mixin
name: theos-box
displayName: TheOS box
description: A TheOS clone in ~/.theos that brings the box current, on top of the built-in claude agent, plus an optional public repo clone.
requires:
  agent: claude

args:
  theos_ref:
    default: main
    description: Branch of github.com/theovkern/TheOS that ~/.theos follows.
    pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
  repo:
    default: ""
    description: Public https://github.com/<owner>/<name> URL, cloned into ~/work/<name>. Empty skips the clone.
    pattern: '^(https://github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+)?$'

# These bite only under `sbx policy init deny-all`; the default policy allows far more.
# Seen in `sbx policy log`: the clone and plugin steps reach github.com, and
# mattpocock-skills installs its dependencies from registry.npmjs.org.
permissions:
  network:
    allow:
      - github.com
      - registry.npmjs.org

# The kit ships no files, because sbx refuses `kit add` on a kit that does and so a live box could never
# be updated. This step is the one thing a box needs before it holds TheOS, and `npm run box -- update`
# reads it from here and runs it in a live box too. Everything after the clone is in scripts/box-refresh.mjs.
# sbx rewrites ~/.claude/settings.json when it creates the box, so the refresh runs after that.
setup:
  install:
    - description: Clone TheOS to ~/.theos and run its refresh script
      user: "1000"
      command: |
        set -eu
        export HOME=/home/agent PATH=/home/agent/.local/bin:$PATH GIT_TERMINAL_PROMPT=0
        ref='${{ kit.args.theos_ref }}'
        dir=$HOME/.theos
        if [ -d "$dir" ] && [ ! -d "$dir/.git" ]; then
          # A box made when the kit shipped copies. Park them: nothing in a box is worth losing silently.
          rm -rf "$dir-replaced"
          mv "$dir" "$dir-replaced"
        fi
        [ -d "$dir/.git" ] || git clone --quiet https://github.com/theovkern/TheOS "$dir"
        git -C "$dir" fetch --quiet origin "+refs/heads/$ref:refs/remotes/origin/$ref"
        git -C "$dir" cat-file -e "origin/$ref:scripts/box-refresh.mjs" 2>/dev/null || { echo "origin/$ref has no scripts/box-refresh.mjs, so a box cannot be refreshed from it; ~/.theos is unchanged" >&2; exit 1; }
        git -C "$dir" checkout --quiet --force -B "$ref" "origin/$ref"
        git -C "$dir" clean --quiet -fd
        echo "theos $ref at $(git -C "$dir" rev-parse --short HEAD)"
        exec node "$dir/scripts/box-refresh.mjs"

    - description: Clone the repo into ~/work/<name>
      user: "1000"
      command: |
        set -e
        repo='${{ kit.args.repo }}'
        [ -n "$repo" ] || exit 0
        dest=/home/agent/work/$(basename "$repo" .git)
        [ -d "$dest/.git" ] && exit 0
        mkdir -p /home/agent/work
        GIT_TERMINAL_PROMPT=0 git clone "$repo" "$dest"
